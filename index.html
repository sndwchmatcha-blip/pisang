<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover">

    <title>Happy Birthday ❤️</title>

    <meta name="theme-color" content="#080808">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!--=========================
        BACKGROUND
    ==========================-->

    <div id="bg">

        <div id="bgGlow"></div>

        <div id="heartContainer"></div>

        <div id="dustContainer"></div>

    </div>



    <!--=========================
            INTRO
    ==========================-->

    <section id="introScreen">

        <div class="introWrapper">

            <p class="introSmall">

                Untuk Kekasihku

            </p>

            <h1 class="introName">

                Anindita

            </h1>

        </div>

    </section>



    <!--=========================
          ENVELOPE SCENE
    ==========================-->

    <section id="envelopeScene">

        <div class="shadowFloor"></div>

        <div id="lightBeam"></div>

        <div id="envelope">

            <div class="envBack"></div>

            <div class="envPaperStack">

                <div class="stack s5"></div>

                <div class="stack s4"></div>

                <div class="stack s3"></div>

                <div class="stack s2"></div>

                <div class="stack s1"></div>

            </div>

            <div class="envLeft"></div>

            <div class="envRight"></div>

            <div class="envBottom"></div>

            <div class="envFlap"></div>

        </div>

        <button id="openButton">

            OPEN

        </button>

    </section>



    <!--=========================
          LETTER AREA
    ==========================-->

    <main id="letterScene">



        <!-- LETTER 1 -->

        <article
            class="paper"
            id="paper1">

            <div class="paperTexture"></div>

            <div class="paperInner">

                <h2>

                    Happy Birthday

                </h2>

                <h3>

                    20 Tahun ❤️

                </h3>

                <div
                    class="typingText"
                    id="typing1">

                </div>

            </div>

        </article>



        <!-- PHOTO 1 -->

        <article
            class="paper photoPaper"
            id="photoPaper1">

            <div class="photoFrame">

                <img
                    src="assets/photo1.jpg"
                    alt="Photo 1">

            </div>

        </article>



        <!-- LETTER 2 -->

        <article
            class="paper"
            id="paper2">

            <div class="paperTexture"></div>

            <div class="paperInner">

                <h2>

                    Untuk Kamu

                </h2>

                <div
                    class="typingText"
                    id="typing2">

                </div>

            </div>

        </article>



        <!-- PHOTO 2 -->

        <article
            class="paper photoPaper"
            id="photoPaper2">

            <div class="photoFrame">

                <img
                    src="assets/photo2.jpg"
                    alt="Photo 2">

            </div>

        </article>



        <!-- LETTER 3 -->

        <article
            class="paper"
            id="paper3">

            <div class="paperTexture"></div>

            <div class="paperInner">

                <h2>

                    Terakhir...

                </h2>

                <div
                    class="typingText"
                    id="typing3">

                </div>

            </div>

        </article>

    </main>



    <!--=========================
            ENDING
    ==========================-->

    <section id="endingScene">

        <div class="endingGlow"></div>

        <h1>

            I Love You

        </h1>

        <h2>

            Anindita ❤️

        </h2>

    </section>



    <!--=========================
        EFFECT CONTAINER
    ==========================-->

    <div id="sparkleContainer"></div>

    <div id="particleContainer"></div>



    <!--=========================
            MUSIC
    ==========================-->

    <audio
        id="bgm"
        preload="auto">

        <source
            src="assets/music.mp3"
            type="audio/mpeg">

    </audio>



    <script src="script.js"></script>

</body>

        </html>
<!--=========================
    
    ==========================-->
