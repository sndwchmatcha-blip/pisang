<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#080808">
    <title>Happy Birthday ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="background">

    <div id="backgroundGlow"></div>

    <div id="heartContainer"></div>

    <div id="dustContainer"></div>

</div>

<section id="intro">

    <div class="intro-content">

        <p class="intro-top">
            Untuk Kekasihku
        </p>

        <h1 class="intro-name">
            Anindita
        </h1>

    </div>

</section>

<section id="envelopeScene">

    <div class="floorShadow"></div>

    <div id="lightEffect"></div>

    <div id="envelope">

        <div class="envelope-back"></div>

        <div class="paper-stack">

            <div class="stack stack5"></div>

            <div class="stack stack4"></div>

            <div class="stack stack3"></div>

            <div class="stack stack2"></div>

            <div class="stack stack1"></div>

        </div>

        <div class="envelope-left"></div>

        <div class="envelope-right"></div>

        <div class="envelope-bottom"></div>

        <div id="envelopeFlap"></div>

    </div>

    <button id="openButton">
        OPEN
    </button>

</section>

<main id="story">
        <section class="paper" id="paper1">

        <div class="paper-texture"></div>

        <div class="paper-content">

            <h2>Happy Birthday</h2>

            <h3>20 Tahun ❤️</h3>

            <div class="typing" id="typing1"></div>

        </div>

    </section>

    <section class="paper photo-paper" id="photoPaper1">

        <div class="photo-frame">

            <img
                src="assets/foto1.jpg"
                alt="foto 1"
                id="foto1">

        </div>

    </section>

    <section class="paper" id="paper2">

        <div class="paper-texture"></div>

        <div class="paper-content">

            <h2>Untuk Kamu</h2>

            <div class="typing" id="typing2"></div>

        </div>

    </section>

    <section class="paper photo-paper" id="photoPaper2">

        <div class="photo-frame">

            <img
                src="assets/foto2.jpg"
                alt="foto 2"
                id="foto2">

        </div>

    </section>

    <section class="paper" id="paper3">

        <div class="paper-texture"></div>

        <div class="paper-content">

            <h2>Terakhir...</h2>

            <div class="typing" id="typing3"></div>

        </div>

    </section>

</main>
<section id="ending">

    <div class="ending-glow"></div>

    <h1>I Love You</h1>

    <h2>Anindita ❤️</h2>

</section>

<div id="sparkleContainer"></div>

<div id="particleContainer"></div>

<audio
    id="music"
    preload="auto">

    <source
        src="assets/music.mp3"
        type="audio/mpeg">

</audio>

<script src="script.js"></script>

</body>
    </html>
